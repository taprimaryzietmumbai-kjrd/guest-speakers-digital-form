<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guest Speakers – Digital Entry Form</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><header class="hero"><div class="badge">ZIET MUMBAI</div><h1>🎙️ List of Guest Speakers</h1><p>Digital Speaker Information & Presentation Record</p></header><form id="speakerForm" class="card"><div class="grid"><div><label>Name of the Speaker <b>*</b></label><input id="name" required></div><div><label>Rank / Post of the Speaker</label><input id="rank"></div><div><label>Department / Organization</label><select id="organization" onchange="toggleOther()"><option value="">Select Organization</option><option>IIT</option><option>IIM</option><option>BTTC</option><option>MU</option><option>HBCSE</option><option>SNDTU</option><option>Others</option></select></div><div id="otherWrap" class="hidden"><label>Other Organization</label><input id="otherOrg"></div><div><label>WhatsApp No. of the Speaker</label><input id="whatsapp" inputmode="tel"></div><div><label>Bank Account of the Speaker</label><input id="bank" inputmode="numeric"></div><div><label>IFSC Code of the Speaker's Branch</label><input id="ifsc" style="text-transform:uppercase"></div><div><label>UPI ID of the Speaker</label><input id="upi"></div><div><label>PAN No. of the Speaker</label><input id="pan" style="text-transform:uppercase"></div><div><label>Presentation Day & Date</label><input id="presentationDate" type="date" onchange="showDay()"><small id="weekday"></small></div><div><label>Presentation From Date</label><input id="fromDate" type="date"></div><div><label>Presentation To Date</label><input id="toDate" type="date"></div><div class="full"><label>Role of the Speaker <b>*</b></label><select id="role" required><option value="">Select Role</option><option>Course Director</option><option>Assistant Course Director</option><option>Resource Person</option><option>Internal Speaker</option><option>Guest Speaker</option></select></div><div class="full"><label>Speaker Signature</label><div class="signatureBox"><canvas id="signature" width="1200" height="300"></canvas><div class="buttons"><button type="button" class="light" onclick="clearSignature()">Clear</button><label class="uploadBtn">Upload Signature Image<input type="file" id="signatureFile" accept="image/png,image/jpeg,image/webp" onchange="loadImage(event)"></label></div><small>Draw using mouse/touch/stylus or upload a PNG/JPG/WebP signature.</small></div></div></div><div class="actions"><button id="saveBtn" type="submit" class="primary">💾 Save Speaker Record</button><button type="button" class="light" onclick="resetForm()">↺ Clear Form</button></div><div id="status"></div></form></main><script src="script.js"></script></body></html>
