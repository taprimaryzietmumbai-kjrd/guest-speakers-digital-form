<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guest Speakers – Digital Entry Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <header class="hero">
    <div class="badge">ZIET MUMBAI</div>
    <h1>🎙️ List of Guest Speakers</h1>
    <p>Digital Speaker Information &amp; Presentation Record</p>
  </header>

  <form id="speakerForm" class="card">
    <div class="grid">
      <div class="full"><label>Workshop Title <b>*</b></label><input id="workshopTitle" required placeholder="Enter the title of the workshop"></div>
      <div class="full"><label>Target Group <b>*</b></label><select id="targetGroup" required><option value="">Select Target Group</option><option>Principal</option><option>Vice-Principal</option><option>Headmaster / Headmistress</option><option>Librarian</option><option>PGT (English)</option><option>PGT (Hindi)</option><option>PGT (Physics)</option><option>PGT (Chemistry)</option><option>PGT (Mathematics)</option><option>PGT (Economics)</option><option>PGT (History)</option><option>PGT (Geography)</option><option>PGT (Commerce)</option><option>PGT (Biology)</option><option>PGT (Bio-Technology)</option><option>TGT (Hindi)</option><option>TGT (English)</option><option>TGT (Sanskrit)</option><option>TGT (Social Studies)</option><option>TGT (Mathematics)</option><option>TGT (Science)</option><option>TGT (Physical &amp; Health Edn.)</option><option>TGT (Art Education)</option><option>TGT (Work Experience)</option><option>Special Educator (TGT)</option><option>Special Educator (PRT)</option><option>PRT</option><option>PRT (Music)</option><option>Administrative Officer</option><option>Finance Officer</option><option>Assistant Engineer</option><option>Assistant Section Officer</option><option>Junior Translator</option><option>Sr. Secretariat Assistant</option><option>Jr. Secretariat Assistant</option><option>Steno Gr I</option><option>Steno Gr II</option><option>WET</option><option>AET</option><option>PRTM</option><option>JSA</option><option>SSA</option><option>SO</option><option>AO</option></select></div>
      <div><label>Name of the Speaker <b>*</b></label><input id="name" required></div>
      <div><label>Role of the Speaker <b>*</b></label>
        <select id="role" required>
          <option value="">Select Role</option>
          <option>Course Director</option>
          <option>Assistant Course Director</option>
          <option>Resource Person</option>
          <option>Internal Speaker</option>
          <option>Guest Speaker</option>
        </select>
      </div>

      <div><label>Department / Organization</label>
        <select id="organization" onchange="toggleOther()">
          <option value="">Select Organization</option>
          <option>IIT</option><option>IIM</option><option>BTTC</option>
          <option>MU</option><option>HBCSE</option><option>SNDTU</option><option>Others</option>
        </select>
      </div>
      <div id="otherWrap" class="hidden"><label>Other Organization</label><input id="otherOrg"></div>

      <div><label>WhatsApp No. of the Speaker</label><input id="whatsapp" inputmode="tel"></div>
      <div><label>Bank Account of the Speaker</label><input id="bank" inputmode="numeric"></div>
      <div><label>IFSC Code of the Speaker's Branch</label><input id="ifsc" style="text-transform:uppercase"></div>
      <div><label>UPI ID of the Speaker</label><input id="upi"></div>
      <div><label>PAN No. of the Speaker</label><input id="pan" style="text-transform:uppercase"></div>

      <div><label>Presentation Day &amp; Date</label><input id="presentationDate" type="date" onchange="showDay()"><small id="weekday"></small></div>
      <div><label>Presentation From Date</label><input id="fromDate" type="date"></div>
      <div><label>Presentation To Date</label><input id="toDate" type="date"></div>

      <div class="full">
        <label>Speaker Signature</label>
        <div class="signatureBox">
          <canvas id="signature" width="1200" height="300"></canvas>
          <div class="buttons">
            <button type="button" class="light" onclick="clearSignature()">Clear</button>
            <label class="uploadBtn">Upload Signature Image
              <input type="file" id="signatureFile" accept="image/png,image/jpeg,image/webp" onchange="loadImage(event)">
            </label>
          </div>
          <small>Draw using mouse/touch/stylus or upload a PNG/JPG/WebP signature.</small>
        </div>
      </div>
    </div>

    <div class="actions no-print">
      <button id="saveBtn" type="submit" class="primary">💾 Save Speaker Record</button>
      <button id="printBtn" type="button" class="printBtn" onclick="printForm()">🖨️ Print / Save as PDF</button>
      <button type="button" class="light" onclick="resetForm()">↺ Clear Form</button>
    </div>
    <div id="status" class="no-print"></div>
  </form>
</main>
<script src="script.js"></script>

<script>
  // Auto-fill Speaker Name and Workshop Title from the personal link
  const params = new URLSearchParams(window.location.search);
  const rp = params.get('rp');
  const workshop = params.get('workshop');

  if (rp) {
    const nameField = document.getElementById('name');
    if (nameField) {
      nameField.value = rp;
      nameField.readOnly = true;
      nameField.style.backgroundColor = '#f1f5f9';
      nameField.style.cursor = 'not-allowed';
    }
  }

  if (workshop) {
    const workshopField = document.getElementById('workshopTitle');
    if (workshopField) {
      workshopField.value = workshop;
      workshopField.readOnly = true;
      workshopField.style.backgroundColor = '#f1f5f9';
      workshopField.style.cursor = 'not-allowed';
    }
  }
</script>

</body>
</html>
